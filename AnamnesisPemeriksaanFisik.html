<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Rikki Sababalat - Anamnesis & Pemeriksaan Fisik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Base Styles */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Tombol Pilihan Dasar */
        .btn-base {
            background-color: white; border: 1px solid #cbd5e1; color: #475569;
            padding: 8px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; transition: all 0.1s;
        }
        .btn-base:hover { background-color: #f1f5f9; }
        
        /* Active States */
        .btn-base.active-ku {
            background-color: #2563eb; color: white; border-color: #2563eb;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
        }
        .btn-base.active-add { background-color: #475569; color: white; border-color: #475569; }

        /* Detail/Sifat Buttons (MULTI SELECT) */
        .btn-detail {
            font-size: 11px; padding: 4px 10px; border-radius: 20px; 
            border: 1px solid #e2e8f0; background: white; color: #64748b;
        }
        .btn-detail.active { background: #0ea5e9; color: white; border-color: #0ea5e9; font-weight: 600; }

        /* Durasi Buttons (SINGLE SELECT) */
        .btn-dur {
            font-size: 11px; padding: 4px 10px; border-radius: 4px; 
            border: 1px solid #e2e8f0; background: white; color: #64748b;
        }
        .btn-dur.active { background: #6366f1; color: white; border-color: #6366f1; font-weight: 600; }

        /* Status Lokalis Buttons */
        .btn-lok {
            font-size: 11px; padding: 4px 8px; border-radius: 6px; 
            border: 1px solid #fed7aa; background: #fff7ed; color: #9a3412;
        }
        .btn-lok.active { background: #ea580c; color: white; border-color: #ea580c; font-weight: bold; }

        /* Sticky Bottom Wrapper */
        .sticky-bottom-wrapper {
            position: sticky; 
            bottom: 0; 
            background: white; 
            border-top: 1px solid #e2e8f0; 
            padding: 10px 10px 5px 10px; 
            z-index: 50; 
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-64"> 

    <div class="max-w-3xl mx-auto bg-white p-3 shadow-sm border-b sticky top-0 z-40 flex justify-between items-center">
        <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-user-doctor text-blue-600"></i>Anamnesis & Pemeriksaan Fisik<span class="text-[10px] bg-blue-100 text-blue-800 px-2 rounded">Easy App</span>
        </h1>
        <button onclick="resetAll()" class="text-xs text-red-500 font-bold border border-red-200 px-3 py-1 rounded hover:bg-red-50">RESET</button>
    </div>

    <div class="max-w-3xl mx-auto p-3 space-y-4">

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
            <h2 class="text-xs font-bold text-blue-800 uppercase mb-2">1. Keluhan Utama (Pilih Satu)</h2>
            <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-3" id="kuGrid"></div>
            
            <div id="kuDetailPanel" class="hidden bg-blue-50 border border-blue-100 rounded-lg p-3">
                <div class="flex justify-between mb-2">
                    <span class="text-sm font-bold text-blue-900" id="kuActiveName"></span>
                </div>
                <div class="space-y-3">
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Durasi (Pilih 1)</span>
                        <div class="flex flex-wrap gap-1 mt-1" id="kuDurationOptions"></div>
                    </div>
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Detail / Sifat (Bisa Banyak)</span>
                        <div class="flex flex-wrap gap-1 mt-1" id="kuTypeOptions"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
            <h2 class="text-xs font-bold text-slate-600 uppercase mb-2">2. Keluhan Tambahan</h2>
            <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-3" id="addGrid"></div>
            <div id="addList" class="space-y-2"></div>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
            <h2 class="text-xs font-bold text-emerald-700 uppercase mb-2">3. Pemeriksaan Fisik</h2>
            <div id="pemfisGrid" class="space-y-3"></div>

            <div class="mt-4 bg-orange-50 border border-orange-200 rounded-lg p-3">
                <h3 class="text-xs font-bold text-orange-800 uppercase mb-2 border-b border-orange-200 pb-1">Status Lokalis (Klik Tombol)</h3>
                <div class="mb-2">
                    <span class="text-[10px] font-bold text-orange-400 block mb-1">A. LOKASI:</span>
                    <div class="flex flex-wrap gap-1" id="lokRegioGrid"></div>
                </div>
                <div class="mb-2">
                    <span class="text-[10px] font-bold text-orange-400 block mb-1">B. MASALAH:</span>
                    <div class="flex flex-wrap gap-1" id="lokLesiGrid"></div>
                </div>
                <div class="flex gap-2 items-center bg-white p-2 rounded border border-orange-100">
                    <input id="lokDim" type="text" placeholder="Ket. Lain / Ukuran (cm)" class="flex-1 text-xs border p-2 rounded outline-none focus:border-orange-500">
                    <button onclick="addLokalis()" class="bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold px-3 py-2 rounded shadow-sm">
                        + LIST
                    </button>
                </div>
                <div id="lokalisList" class="mt-2 space-y-1"></div>
            </div>
        </section>

    </div>

    <div class="sticky-bottom-wrapper max-w-3xl mx-auto">
        <div class="flex justify-between mb-1 px-1">
            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Preview & Bisa di Edit Manual</span>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-2">
            <div class="relative group">
                <div class="absolute top-0 right-0 bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-bl font-bold opacity-50 group-hover:opacity-100 pointer-events-none">ANAMNESIS</div>
                <textarea id="outputAnamnesis" class="w-full h-24 p-2 text-sm border-2 border-slate-200 rounded-lg bg-white text-slate-800 font-mono resize-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" placeholder="..."></textarea>
            </div>
            <div class="relative group">
                <div class="absolute top-0 right-0 bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-bl font-bold opacity-50 group-hover:opacity-100 pointer-events-none">PEMFIS</div>
                <textarea id="outputPemfis" class="w-full h-24 p-2 text-sm border-2 border-slate-200 rounded-lg bg-white text-slate-800 font-mono resize-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition" placeholder="..."></textarea>
            </div>
        </div>
        
        <div class="flex gap-2 mb-2">
            <button onclick="copyToClipboard('outputAnamnesis')" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded shadow hover:bg-blue-700 active:scale-95 transition text-xs flex justify-center items-center gap-2">
                <i class="fa-regular fa-copy"></i> COPY ANAMNESIS
            </button>
            <button onclick="copyToClipboard('outputPemfis')" class="flex-1 bg-emerald-600 text-white font-bold py-2 rounded shadow hover:bg-emerald-700 active:scale-95 transition text-xs flex justify-center items-center gap-2">
                <i class="fa-regular fa-copy"></i> COPY PEMFIS
            </button>
        </div>

        <footer class="text-center pt-2 pb-1 text-[10px] text-slate-400 font-medium border-t border-slate-100">
            &copy; <span id="yearDisplay"></span> @dr.RikkiSababalat Easy App
        </footer>
    </div>

    <script>
        document.getElementById('yearDisplay').textContent = new Date().getFullYear();

        // --- DATA ---
        const complaints = [
            "Batuk", "Pilek", "Demam", "Nyeri Kepala", "Nyeri Dada", "Nyeri Perut", 
            "Sesak", "Mual", "Muntah", "Diare", "Luka", "Gatal", "Lemas", "Sakit Gigi"
        ];
        
        const detailsDB = {
            "Batuk": ["Kering", "Berdahak", "Darah", "Alergi"],
            "Pilek": ["Cair", "Kental", "Sumbat"],
            "Demam": ["Naik-Turun", "Terus-menerus", "Menggigil", "Malam"],
            "Nyeri Kepala": ["Berdenyut", "Terikat", "Migrain", "Pusing Berputar"],
            "Nyeri Dada": ["Tertusuk", "Menjalar ke lengan", "Berkaitan dengan napas", "Berat di dada", "Tertekan Berat"],
            "Nyeri Perut": ["Ulu Hati", "Kanan Bawah", "Melilit", "Perih"],
            "Sesak": ["Aktivitas", "Tidur", "Mengi", "Berat di dada"],
            "Mual": ["Makan", "Pagi"],
            "Muntah": ["Makanan", "Air", "Darah"],
            "Diare": ["Cair", "Lendir", "Darah", "Ampas"],
            "Luka": ["Lecet", "Robek", "Bakar", "Memar"],
            "Gatal": ["Seluruh Tubuh", "Lokal", "Biduran", "Malam hari"],
            "Lemas": ["Terus menerus", "Mendadak"],
            "Sakit Gigi": ["Berlubang", "Gusi Bengkak", "Nyeri Spontan"]
        };
        
        const durations = ["1 Hari", "2 Hari", "3 Hari", "4-5 Hari", "1 Minggu", "> 1 Mgg"];
        const pemfisDB = {
            "Mata": ["Konjungtiva Anemis (-)", "Sklera Ikterik (-)"],
            "Thorax": ["Simetris", "Vesikuler (+/+)", "Ronkhi (-/-)", "Wheezing (-/-)"],
            "Jantung": ["BJ I-II Murni", "Gallop (-)", "Murmur (-)"],
            "Abdomen": ["Supel", "Nyeri Tekan (-)", "BU (+) N"],
            "Ekstremitas": ["Akral Hangat", "CRT < 2d", "Edema (-)"]
        };
        const lokalisOpts = {
            regio: ["Wajah", "Kepala", "Leher", "Dada", "Punggung", "Perut", "Lengan Kanan", "Lengan Kiri", "Kaki Kanan", "Kaki Kiri"],
            lesi: ["Luka Lecet", "Luka Robek", "Luka Bakar", "Benjolan", "Abses", "Kemerahan", "Nyeri Tekan", "Bengkak"]
        };

        // --- STATE ---
        // types diubah jadi Array [] untuk menampung banyak pilihan
        let kuData = { name: null, duration: null, types: [] }; 
        let addData = []; // item structure: { ..., types: [] }
        let pemfisData = {};
        let lokalisList = [];
        let tempLokalis = { regio: null, lesi: null };

        // --- INIT ---
        function init() {
            const kuGrid = document.getElementById('kuGrid');
            const addGrid = document.getElementById('addGrid');
            complaints.forEach(c => {
                kuGrid.innerHTML += `<button onclick="selectKU('${c}')" id="ku_btn_${c.replace(/\s/g,'')}" class="btn-base">${c}</button>`;
                addGrid.innerHTML += `<button onclick="toggleAdd('${c}')" id="add_btn_${c.replace(/\s/g,'')}" class="btn-base">+ ${c}</button>`;
            });

            const pfGrid = document.getElementById('pemfisGrid');
            for(let [cat, items] of Object.entries(pemfisDB)){
                let html = `<div class="bg-slate-50 p-2 rounded border border-slate-100"><span class="text-[10px] font-bold text-slate-500 uppercase block mb-1">${cat}</span><div class="flex flex-wrap gap-1">`;
                items.forEach(item => {
                    html += `<button onclick="togglePemfis(this, '${cat}', '${item}')" class="btn-detail">${item}</button>`;
                });
                html += `</div></div>`;
                pfGrid.innerHTML += html;
            }

            const rGrid = document.getElementById('lokRegioGrid');
            lokalisOpts.regio.forEach(r => { rGrid.innerHTML += `<button onclick="selectLokalisItem('regio', '${r}', this)" class="btn-lok lok-regio">${r}</button>`; });
            const lGrid = document.getElementById('lokLesiGrid');
            lokalisOpts.lesi.forEach(l => { lGrid.innerHTML += `<button onclick="selectLokalisItem('lesi', '${l}', this)" class="btn-lok lok-lesi">${l}</button>`; });
        }

        // --- LOGIC KELUHAN UTAMA ---
        function selectKU(name) {
            if(kuData.name === name) kuData = { name: null, duration: null, types: [] };
            else kuData = { name: name, duration: null, types: [] };
            renderKUPanel(); updateOutput();
        }

        function renderKUPanel() {
            document.querySelectorAll('#kuGrid .btn-base').forEach(b => b.classList.remove('active-ku'));
            const panel = document.getElementById('kuDetailPanel');
            if(kuData.name) {
                document.getElementById(`ku_btn_${kuData.name.replace(/\s/g,'')}`).classList.add('active-ku');
                panel.classList.remove('hidden');
                document.getElementById('kuActiveName').textContent = kuData.name;
                
                // Durasi (Single Select)
                const durCont = document.getElementById('kuDurationOptions'); durCont.innerHTML = "";
                durations.forEach(d => { 
                    durCont.innerHTML += `<button onclick="kuData.duration='${d}';renderKUPanel();updateOutput()" class="btn-dur ${kuData.duration===d?'active':''}">${d}</button>`; 
                });
                
                // Tipe (MULTI SELECT)
                const typeCont = document.getElementById('kuTypeOptions'); typeCont.innerHTML = "";
                (detailsDB[kuData.name]||[]).forEach(t => { 
                    const isActive = kuData.types.includes(t);
                    typeCont.innerHTML += `<button onclick="toggleKUType('${t}')" class="btn-detail ${isActive?'active':''}">${t}</button>`; 
                });
            } else { panel.classList.add('hidden'); }
        }

        function toggleKUType(val) {
            if(kuData.types.includes(val)) {
                kuData.types = kuData.types.filter(item => item !== val);
            } else {
                kuData.types.push(val);
            }
            renderKUPanel(); updateOutput();
        }

        // --- LOGIC KELUHAN TAMBAHAN ---
        function toggleAdd(name) {
            const idx = addData.findIndex(x => x.name === name);
            if(idx >= 0) addData.splice(idx, 1);
            else addData.push({ id: Date.now(), name: name, duration: null, types: [] });
            renderAddList(); updateOutput();
        }

        function renderAddList() {
            document.querySelectorAll('#addGrid .btn-base').forEach(b => b.classList.remove('active-add'));
            const list = document.getElementById('addList'); list.innerHTML = "";
            addData.forEach(item => {
                document.getElementById(`add_btn_${item.name.replace(/\s/g,'')}`).classList.add('active-add');
                let html = `<div class="bg-slate-50 border border-slate-200 rounded p-2 text-xs mb-1 relative"><div class="font-bold text-slate-700 mb-1 flex justify-between"><span>${item.name}</span><button onclick="toggleAdd('${item.name}')" class="text-red-400">X</button></div>`;
                
                // Durasi (Single)
                html += `<div class="flex flex-wrap gap-1 mb-1">`;
                durations.forEach(d => { html += `<button onclick="updateAddDuration(${item.id}, '${d}')" class="btn-dur ${item.duration===d?'active':''}">${d}</button>`; });
                html += `</div>`;
                
                // Tipe (Multi)
                html += `<div class="flex flex-wrap gap-1">`;
                (detailsDB[item.name]||[]).forEach(t => { 
                    const isActive = item.types.includes(t);
                    html += `<button onclick="toggleAddType(${item.id}, '${t}')" class="btn-detail ${isActive?'active':''}">${t}</button>`; 
                });
                html += `</div></div>`;
                list.innerHTML += html;
            });
        }

        function updateAddDuration(id, val) {
            const item = addData.find(x => x.id === id);
            if(item) { item.duration = val; renderAddList(); updateOutput(); }
        }

        function toggleAddType(id, val) {
            const item = addData.find(x => x.id === id);
            if(item) {
                if(item.types.includes(val)) {
                    item.types = item.types.filter(t => t !== val);
                } else {
                    item.types.push(val);
                }
                renderAddList(); updateOutput();
            }
        }

        // --- PEMFIS & LOKALIS ---
        function togglePemfis(btn, cat, item) {
            if(!pemfisData[cat]) pemfisData[cat] = new Set();
            if(pemfisData[cat].has(item)) { pemfisData[cat].delete(item); btn.classList.remove('active'); }
            else { pemfisData[cat].add(item); btn.classList.add('active'); }
            updatePemfisOutput();
        }

        function selectLokalisItem(type, val, btn) {
            const groupClass = type === 'regio' ? '.lok-regio' : '.lok-lesi';
            document.querySelectorAll(groupClass).forEach(b => b.classList.remove('active'));
            if(tempLokalis[type] === val) { tempLokalis[type] = null; } 
            else { tempLokalis[type] = val; btn.classList.add('active'); }
        }

        function addLokalis() {
            if(!tempLokalis.regio || !tempLokalis.lesi) return;
            const dim = document.getElementById('lokDim').value;
            let txt = `${tempLokalis.regio}: Tampak ${tempLokalis.lesi}`;
            if(dim) txt += ` (${dim})`;
            lokalisList.push(txt);
            renderLokalisList(); updatePemfisOutput();
            document.querySelectorAll('.btn-lok').forEach(b => b.classList.remove('active'));
            tempLokalis = { regio: null, lesi: null };
            document.getElementById('lokDim').value = "";
        }

        function renderLokalisList() {
            const div = document.getElementById('lokalisList'); div.innerHTML = "";
            lokalisList.forEach((t, i) => { div.innerHTML += `<div class="flex justify-between bg-white border border-orange-100 p-1 rounded text-[10px]"><span>${t}</span><button onclick="lokalisList.splice(${i},1);renderLokalisList();updatePemfisOutput()" class="text-red-500 font-bold px-2">x</button></div>`; });
        }

        // --- OUTPUT GENERATOR ---
        function updateOutput() {
            let parts = [];
            // KU
            if(kuData.name) {
                let s = `Keluhan Utama: ${kuData.name}`;
                // Join array types dengan koma
                if(kuData.types.length > 0) s += ` (${kuData.types.join(', ')})`;
                if(kuData.duration) s += ` sejak ${kuData.duration} yll`;
                parts.push(s + ".");
            }
            // Tambahan
            if(addData.length > 0) {
                let s = "Keluhan Tambahan: ";
                let items = [];
                addData.forEach(d => {
                    let sub = d.name;
                    if(d.types.length > 0) sub += ` (${d.types.join(', ')})`;
                    if(d.duration) sub += ` selama ${d.duration}`;
                    items.push(sub);
                });
                parts.push(s + items.join(", ") + ".");
            }
            document.getElementById('outputAnamnesis').value = parts.join("\n");
        }

        function updatePemfisOutput() {
            let lines = [];
            for(let [cat, set] of Object.entries(pemfisData)) {
                if(set.size > 0) lines.push(`${cat}: ${Array.from(set).join(', ')}`);
            }
            if(lokalisList.length > 0) {
                lines.push("STATUS LOKALIS:");
                lokalisList.forEach(l => lines.push("- " + l));
            }
            document.getElementById('outputPemfis').value = lines.length ? "O:\n" + lines.join('\n') : "";
        }

        function copyToClipboard(id) {
            const el = document.getElementById(id);
            el.select(); navigator.clipboard.writeText(el.value);
            const originalBorder = el.style.borderColor;
            el.style.borderColor = "#22c55e"; setTimeout(() => el.style.borderColor = "", 500);
        }

        function resetAll() { if(confirm("Reset Form?")) location.reload(); }

        init();
    </script>
</body>
</html>
