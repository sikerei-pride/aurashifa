<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Telah Diupgrade - Pindah Halaman</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="antialiased">

    <div class="min-h-screen bg-gradient-to-br from-indigo-600 via-blue-600 to-orange-400 flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md bg-white/90 backdrop-blur-lg rounded-3xl shadow-2xl p-7 text-center relative overflow-hidden border border-white/30 transition-all duration-300 hover:shadow-[0_20px_50px_rgba(8,_112,_184,_0.7)]">

            <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-300 opacity-40 rounded-full blur-3xl animate-pulse"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-300 opacity-40 rounded-full blur-3xl animate-pulse"></div>

            <div class="relative z-10 inline-flex items-center gap-2 bg-gradient-to-r from-orange-400 to-pink-500 text-white text-xs font-semibold px-4 py-1.5 rounded-full mb-5 shadow-md">
                <i class="fa-solid fa-sparkles text-[10px]"></i>
                Versi Terbaru Tersedia
            </div>

            <div class="relative z-10 w-20 h-20 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-500 text-white flex items-center justify-center text-3xl shadow-lg animate-float border border-white/20">
                <i class="fa-solid fa-rocket"></i>
            </div>

            <h1 class="relative z-10 text-xl sm:text-2xl font-extrabold text-slate-800 mb-3 leading-snug tracking-tight">
                Website Telah Diupgrade 🚀
            </h1>

            <p class="relative z-10 text-sm sm:text-base text-slate-600 leading-relaxed mb-8 px-2">
                Halaman yang Anda akses kini menggunakan model sistem terbaru dengan tampilan lebih modern dan performa lebih cepat.
                Silakan kunjungi versi terbaru melalui tombol di bawah ini.
            </p>

            <a 
                href="https://papeda-dingin.vercel.app"
                class="relative z-10 w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-500 hover:to-blue-400 hover:scale-[1.03] active:scale-[0.98] transition-all duration-200 ease-out text-white font-bold py-3.5 rounded-xl shadow-[0_10px_20px_rgba(79,_70,_229,_0.3)] text-sm sm:text-base"
            >
                Kunjungi Versi Terbaru
                <i class="fa-solid fa-arrow-right transition-transform group-hover:translate-x-1"></i>
            </a>

        </div>

    </div>

</body>
</html>
